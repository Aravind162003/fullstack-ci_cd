name: CI-CD-Pipeline

on:
  push:
    branches:
      - master

jobs:

  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24]

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # Backend
      - name: Install Backend Dependencies
        run: |
          cd backend
          npm install

      # Frontend
      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install


  security-check:

    runs-on: ubuntu-latest
    needs: build

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Trivy
        run: |
          sudo apt-get update -y
          sudo apt-get install -y wget gnupg

          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | \
          gpg --dearmor | \
          sudo tee /usr/share/keyrings/trivy.gpg > /dev/null

          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | \
          sudo tee -a /etc/apt/sources.list.d/trivy.list

          sudo apt-get update -y
          sudo apt-get install -y trivy

      - name: Trivy File System Scan
        run: |
          trivy fs --format table -o fs-report.json .

      - name: Install Gitleaks
        run: |
          sudo apt update -y
          sudo apt install -y gitleaks

      - name: Gitleaks Code Scan
        run: |
          gitleaks detect source . -r gitleaks-report.json -f json


  build_docker_image_and_push:

    runs-on: ubuntu-latest
    needs: security-check

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      # Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Setup QEMU
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # Setup Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build & Push Backend Image
      - name: Build and Push Backend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: aravind2003/fullstack-backend:latest
          file: ./backend/Dockerfile

      # Build & Push Frontend Image
      - name: Build and Push Frontend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: aravind2003/fullstack-frontend:latest
          file: ./frontend/Dockerfile


  deploy_to_kubernetes:

    runs-on: ubuntu-latest
    needs: build_docker_image_and_push

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      # Install kubectl
      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      # Configure kubeconfig
      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG }}" > $HOME/.kube/config

      # Verify cluster connection
      - name: Verify Kubernetes Cluster
        run: |
          kubectl get nodes

      # Deploy application
      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f k8s/
